<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;}
canvas{background:#000;display:block;margin:auto;}
.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;}
button{width:50px;height:50px;font-size:24px;background:#555;color:#fff;border:none;border-radius:5px;}
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<div class="controls">
<button id="up">↑</button>
<button id="left">←</button>
<button id="right">→</button>
<button id="down">↓</button>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const grid=20;
let count=0;
let snake={x:grid*5,y:grid*5,dx:grid,dy:0,maxCells:4,cells:[]};
let apple={x:grid*10,y:grid*10};
function getRandomInt(max){return Math.floor(Math.random()*max);}
function loop(){requestAnimationFrame(loop);if(++count<4)return;count=0;ctx.fillStyle='#111';ctx.fillRect(0,0,canvas.width,canvas.height);
snake.x+=snake.dx;snake.y+=snake.dy;
if(snake.x<0)snake.x=canvas.width-grid; if(snake.x>=canvas.width)snake.x=0; if(snake.y<0)snake.y=canvas.height-grid; if(snake.y>=canvas.height)snake.y=0;
snake.cells.unshift({x:snake.x,y:snake.y}); if(snake.cells.length>snake.maxCells)snake.cells.pop();
ctx.fillStyle='red'; ctx.fillRect(apple.x,apple.y,grid-1,grid-1);
ctx.fillStyle='lime'; snake.cells.forEach(c=>{ctx.fillRect(c.x,c.y,grid-1,grid-1); if(c.x===apple.x && c.y===apple.y){snake.maxCells++; apple.x=getRandomInt(canvas.width/grid)*grid; apple.y=getRandomInt(canvas.height/grid)*grid}});
for(let i=1;i<snake.cells.length;i++){if(snake.cells[0].x===snake.cells[i].x && snake.cells[0].y===snake.cells[i].y){snake.maxCells=4; snake.cells.splice(i);}}
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft' && snake.dx===0){snake.dx=-grid;snake.dy=0;} else if(e.key==='ArrowUp' && snake.dy===0){snake.dx=0;snake.dy=-grid;} else if(e.key==='ArrowRight' && snake.dx===0){snake.dx=grid;snake.dy=0;} else if(e.key==='ArrowDown' && snake.dy===0){snake.dx=0;snake.dy=grid;} else if(e.key==='a' && snake.dx===0){snake.dx=-grid;snake.dy=0;} else if(e.key==='w' && snake.dy===0){snake.dx=0;snake.dy=-grid;} else if(e.key==='d' && snake.dx===0){snake.dx=grid;snake.dy=0;} else if(e.key==='s' && snake.dy===0){snake.dx=0;snake.dy=grid;}});
['up','down','left','right'].forEach(dir=>{document.getElementById(dir).addEventListener('click',()=>{if(dir==='left' && snake.dx===0){snake.dx=-grid;snake.dy=0;} if(dir==='right' && snake.dx===0){snake.dx=grid;snake.dy=0;} if(dir==='up' && snake.dy===0){snake.dx=0;snake.dy=-grid;} if(dir==='down' && snake.dy===0){snake.dx=0;snake.dy=grid;}})});
requestAnimationFrame(loop);
</script>
</body>
</html>
